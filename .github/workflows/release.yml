name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/version-drift/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify tag and package versions
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, tomllib
          tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = pathlib.Path("src/version_drift/__init__.py").read_text()
          runtime = re.search(r'__version__ = "([^"]+)"', init).group(1)
          assert tag == f"v{project}", (tag, project)
          assert runtime == project, (runtime, project)
          PY
      - run: python -m pip install --upgrade pip build pytest twine
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke installed wheel
        shell: bash
        run: |
          python -m venv /tmp/version-drift-release
          /tmp/version-drift-release/bin/python -m pip install dist/*.whl
          /tmp/version-drift-release/bin/version-drift --version
          /tmp/version-drift-release/bin/version-drift --help
          /tmp/version-drift-release/bin/python -m pip check
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
