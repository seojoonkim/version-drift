name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pytest -q
      - run: python -m build
      - name: Smoke installed wheel
        shell: bash
        run: |
          python -m venv /tmp/version-drift-smoke
          /tmp/version-drift-smoke/bin/python -m pip install dist/*.whl
          /tmp/version-drift-smoke/bin/version-drift --version
          /tmp/version-drift-smoke/bin/version-drift --help
          /tmp/version-drift-smoke/bin/python -m pip check
